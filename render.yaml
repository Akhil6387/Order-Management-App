services:
  # Backend API on Render
  - type: web
    name: oms-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oms-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app

databases:
  - name: oms-postgres
    plan: free
